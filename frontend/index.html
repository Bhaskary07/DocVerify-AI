<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocVerify AI</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #f4f6f9; color: #222; }
    .card { max-width: 780px; background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 16px; }
    input, select, button { padding: 8px 12px; margin: 4px 0; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="auth-section" class="card">
    <h2>Login or Register (US-03)</h2>
    <input id="email" type="email" placeholder="Email" value="applicant@docverify.ai" />
    <input id="password" type="password" placeholder="Password" value="apply123" />
    <select id="role">
      <option value="Applicant">Applicant</option>
      <option value="Reviewer">Reviewer</option>
      <option value="Admin">Admin</option>
    </select>
    <button onclick="login()">Login</button>
    <button onclick="register()">Register</button>
    <p id="auth-msg"></p>
  </div>
  <div id="session-section" class="card hidden">
    <div id="user-bar"></div>
    <button onclick="logout()">Logout</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
